<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spiral Stairwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<script type="module">
import * as THREE from 'three';

// ---------------------------------------------------------------- utils
function mulberry32(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261007);
const rr = (a, b) => a + (b - a) * rand();
const Y = new THREE.Vector3(0, 1, 0);

// 3段階のトゥーン階調（アニメ調のフラットな陰影）
const grad = new THREE.DataTexture(new Uint8Array([150, 215, 255]), 3, 1, THREE.RedFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter;
grad.needsUpdate = true;
const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap: grad, ...extra });
const flat = (color, extra = {}) => new THREE.MeshBasicMaterial({ color, ...extra });

// ---------------------------------------------------------------- renderer / camera
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 5, 0);
const upAng = Math.PI / 4 + 0.12;           // 正方形の吹き抜けを菱形に見せる
camera.up.set(Math.cos(upAng), 0, Math.sin(upAng));
camera.lookAt(0.4, -40, -0.2);

// ---------------------------------------------------------------- sky (背景)
function makeSky() {
  const c = document.createElement('canvas');
  c.width = 1600; c.height = 900;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, c.width, c.height);
  const band = g.createLinearGradient(0, 0, 0, c.height);
  band.addColorStop(0.00, '#ffffff');
  band.addColorStop(0.10, '#f2fbfe');
  band.addColorStop(0.15, '#cdeffa');
  band.addColorStop(0.85, '#cdeffa');
  band.addColorStop(0.90, '#f2fbfe');
  band.addColorStop(1.00, '#ffffff');
  g.fillStyle = band;
  g.fillRect(0, 0, c.width, c.height);
  const glow = g.createRadialGradient(800, 450, 50, 800, 450, 520);
  glow.addColorStop(0, 'rgba(120,215,245,0.9)');
  glow.addColorStop(1, 'rgba(120,215,245,0)');
  g.fillStyle = glow;
  g.fillRect(0, 0, c.width, c.height);
  // 水彩っぽい青いにじみ
  const cols = ['#9ddff6', '#6fcdf3', '#3aa6ee', '#1f86e6', '#bdeefa'];
  g.filter = 'blur(14px)';
  for (let i = 0; i < 46; i++) {
    g.globalAlpha = rr(0.35, 0.9);
    g.fillStyle = cols[Math.floor(rand() * cols.length)];
    g.beginPath();
    const y = rand() < 0.5 ? rr(120, 330) : rr(560, 790);
    g.ellipse(rr(0, 1600), y, rr(40, 220), rr(14, 60), rr(-0.4, 0.4), 0, Math.PI * 2);
    g.fill();
  }
  g.filter = 'none';
  g.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// ================================================================ WORLD (螺旋階段)
const world = new THREE.Scene();
world.background = makeSky();
world.fog = new THREE.Fog(0x0f9cf0, 4, 48);
world.add(new THREE.HemisphereLight(0xffffff, 0x7fcff5, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(2, 10, 3);
world.add(sun);

const HOLE = 4.6;           // 吹き抜けの半幅
const OUT = 8.0;            // 階段外周の半幅
const N = 8;               // 1辺あたりの段数
const RISE = 0.2;          // 蹴上げ
const SIDE = (N + 1) * RISE; // 1辺(+踊り場)で下がる高さ
const T = 2 * HOLE / N;    // 踏面
const BAND = OUT - HOLE;
const MID = (HOLE + OUT) / 2;
const TH = 0.6;            // 段の厚み
const RAIL = 0.9;          // 手すりの高さ
const K0 = -6, K1 = 90;    // 生成する辺の範囲

const sideMatrix = k => new THREE.Matrix4().makeTranslation(0, -k * SIDE, 0)
  .multiply(new THREE.Matrix4().makeRotationY(k * Math.PI / 2));
const boxM = (x, y, z, sx, sy, sz) => new THREE.Matrix4().compose(
  new THREE.Vector3(x, y, z), new THREE.Quaternion(), new THREE.Vector3(sx, sy, sz));
const P = (x, y, z, M) => new THREE.Vector3(x, y, z).applyMatrix4(M);
const innerRailY = x => RAIL + RISE * 0.5 - (x + HOLE) / (2 * HOLE) * SIDE;
const outerRailY = x => RAIL - ((x + HOLE) / T - 0.5) * RISE;

const L = { tread: [], stringer: [], nose: [], post: [], rail: [] };
const innerPts = [], outerPts = [];
const IZ = HOLE + 0.13, OZ = OUT - 0.12;
const LANDING_SPAN = OUT - HOLE + T / 2;

function segment(a, b, list) {
  const d = b.clone().sub(a);
  const len = d.length();
  if (len < 1e-3) return;
  list.push(new THREE.Matrix4().compose(
    a.clone().add(b).multiplyScalar(0.5),
    new THREE.Quaternion().setFromUnitVectors(Y, d.normalize()),
    new THREE.Vector3(1, len, 1)));
}

for (let k = K0; k <= K1; k++) {
  const M = sideMatrix(k);
  innerPts.push(P(-HOLE, innerRailY(-HOLE), IZ, M));
  for (let i = 0; i < N; i++) {
    const x = -HOLE + (i + 0.5) * T, top = -i * RISE;
    L.tread.push(M.clone().multiply(boxM(x, top - TH / 2, MID, T, TH, BAND)));
    L.stringer.push(M.clone().multiply(boxM(x, top - TH / 2 + 0.03, IZ, T, TH + 0.06, 0.12)));
    L.nose.push(M.clone().multiply(boxM(x + T / 2, top, MID, 0.09, 0.09, BAND)));
    for (const f of [0.25, 0.75]) {
      const px = -HOLE + (i + f) * T;
      segment(P(px, top, IZ, M), P(px, innerRailY(px), IZ, M), L.post);
      segment(P(px, top, OZ, M), P(px, outerRailY(px), OZ, M), L.post);
    }
    outerPts.push(P(x, top + RAIL, OZ, M));
  }
  // 踊り場
  const yL = -N * RISE;
  L.tread.push(M.clone().multiply(boxM(MID, yL - TH / 2, MID, BAND, TH, BAND)));
  L.nose.push(M.clone().multiply(boxM(HOLE, yL, MID, 0.09, 0.09, BAND)));
  outerPts.push(P(OZ, yL + RAIL, OZ, M));
  const n = 8;
  for (let j = 0; j < n; j++) {
    const a = HOLE + (j + 0.5) / n * BAND;
    const s = (OUT - a) / LANDING_SPAN;
    segment(P(a, yL, OZ, M), P(a, yL + RAIL + RISE * s, OZ, M), L.post);
    segment(P(OZ, yL, a, M), P(OZ, yL + RAIL - RISE * s, a, M), L.post);
  }
}
innerPts.push(P(-HOLE, innerRailY(-HOLE), IZ, sideMatrix(K1 + 1)));
for (let i = 0; i < innerPts.length - 1; i++) segment(innerPts[i], innerPts[i + 1], L.rail);
for (let i = 0; i < outerPts.length - 1; i++) segment(outerPts[i], outerPts[i + 1], L.rail);

function instanced(geo, mat, list) {
  const m = new THREE.InstancedMesh(geo, mat, list.length);
  list.forEach((mx, i) => m.setMatrixAt(i, mx));
  m.instanceMatrix.needsUpdate = true;
  m.frustumCulled = false;
  return m;
}
const unitBox = new THREE.BoxGeometry(1, 1, 1);
const stairs = new THREE.Group();
stairs.add(
  instanced(unitBox, toon(0x74e8f2), L.tread),
  instanced(unitBox, toon(0x2fb4ec), L.stringer),
  instanced(unitBox, flat(0xe9fdff), L.nose),
  instanced(new THREE.CylinderGeometry(0.045, 0.045, 1, 6), flat(0x5ab3e3), L.post),
  instanced(new THREE.CylinderGeometry(0.075, 0.075, 1, 6), flat(0x3d9cd8), L.rail),
);
world.add(stairs);

// ================================================================ FOREGROUND (球体 + 紙吹雪)
const fg = new THREE.Scene();
fg.add(new THREE.HemisphereLight(0xe8fbff, 0x24345e, 1.1));

// カメラと同じ向きの座標系: x=画面右, y=画面上, z=カメラ方向
const frame = new THREE.Group();
frame.position.copy(camera.position).addScaledVector(camera.getWorldDirection(new THREE.Vector3()), 14);
frame.quaternion.copy(camera.quaternion);
fg.add(frame);
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(-6, 7, 9);
key.target = frame;
frame.add(key);

const R = 3.1;
const body = new THREE.Group();
frame.add(body);
body.add(new THREE.Mesh(new THREE.SphereGeometry(R, 64, 48), toon(0x2b3254)));

function place(obj, dir, off) {
  const n = new THREE.Vector3(...dir).normalize();
  obj.position.copy(n).multiplyScalar(R + off);
  obj.quaternion.setFromUnitVectors(Y, n);
  body.add(obj);
  return obj;
}

function stripeTexture() {
  const c = document.createElement('canvas');
  c.width = 4; c.height = 64;
  const g = c.getContext('2d');
  for (let i = 0; i < 8; i++) {
    g.fillStyle = i % 2 ? '#1d2236' : '#f3f6fb';
    g.fillRect(0, i * 8, 4, 8);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const white = toon(0xf4f7fc);
const dark = toon(0x1d2236);
const spikeMat = toon(0xffffff, { map: stripeTexture() });
const spikeGeo = new THREE.ConeGeometry(0.34, 1.0, 32);

// とげ（縞模様の円錐）
for (const d of [[-0.45, 0.85, 0.25], [0.32, 0.92, -0.05], [-0.98, 0.15, 0.12], [-0.62, -0.72, 0.2],
                 [0.35, -0.9, 0.22], [0.86, -0.42, 0.28], [-0.85, 0.45, -0.2], [0.1, -0.7, -0.7]]) {
  place(new THREE.Mesh(spikeGeo, spikeMat), d, 0.42);
}
// 鋲（段々の円盤）
function stud() {
  const g = new THREE.Group();
  let y = 0;
  for (const [rt, rb, h, mat] of [[0.42, 0.46, 0.1, white], [0.32, 0.36, 0.12, dark],
                                  [0.23, 0.27, 0.12, white], [0.13, 0.17, 0.12, dark]]) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 28), mat);
    m.position.y = y + h / 2;
    y += h;
    g.add(m);
  }
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.22, 16), white);
  tip.position.y = y + 0.11;
  g.add(tip);
  return g;
}
for (const d of [[-0.22, 0.38, 0.9], [-0.58, 0.05, 0.81], [-0.18, -0.28, 0.94], [0.02, -0.62, 0.78],
                 [0.18, 0.72, 0.67], [-0.42, 0.7, 0.58], [0.92, 0.0, 0.38], [-0.7, -0.4, 0.58]]) {
  place(stud(), d, -0.04);
}

// 緑の円盤（ハッチ）
const discDir = [0.55, 0.3, 0.78];
place(new THREE.Mesh(new THREE.SphereGeometry(R * 1.012, 48, 16, 0, Math.PI * 2, 0, 0.5), toon(0x46e5b6)), discDir, -R);
place(new THREE.Mesh(new THREE.SphereGeometry(R * 1.016, 48, 4, 0, Math.PI * 2, 0.47, 0.05), toon(0x2fbf9a)), discDir, -R);

// アンテナ
const antenna = place(new THREE.Group(), [0.12, 0.95, 0.22], -0.1);
{
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.07, 3.7, 10), dark);
  mast.position.y = 1.85;
  antenna.add(mast);
  const leaf = new THREE.Mesh(new THREE.CapsuleGeometry(0.26, 1.1, 8, 20), toon(0x3a6fe6));
  leaf.position.y = 2.9;
  leaf.scale.set(1, 1, 0.55);
  antenna.add(leaf);
  const halo = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.06, 10, 48), toon(0xe98ae2));
  halo.position.y = 1.4;
  halo.rotation.x = Math.PI / 2 + 0.35;
  antenna.add(halo);
  const halo2 = new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.07, 10, 48), toon(0x3f86e6));
  halo2.position.y = 0.55;
  halo2.rotation.set(Math.PI / 2 - 0.55, 0, 0.3);
  antenna.add(halo2);
}

// パラボラ
const dish = place(new THREE.Group(), [0.93, 0.36, 0.12], -0.05);
{
  const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 1.0, 10), dark);
  stalk.position.y = 0.5;
  dish.add(stalk);
  const bowl = new THREE.Mesh(new THREE.SphereGeometry(1.2, 40, 12, 0, Math.PI * 2, 0, 1.05),
    toon(0x2f66d8, { side: THREE.DoubleSide }));
  bowl.scale.y = 0.5;
  bowl.rotation.x = Math.PI;
  bowl.position.y = 1.55;
  dish.add(bowl);
  const feed = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.1, 8), toon(0xe98ae2));
  feed.position.y = 1.6;
  dish.add(feed);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 8), toon(0xe98ae2));
  tip.position.y = 2.15;
  dish.add(tip);
}

// 惑星の輪
const ring1 = new THREE.Mesh(new THREE.TorusGeometry(4.8, 0.1, 10, 220), toon(0x9fdcf6));
ring1.rotation.set(1.2, 0.3, -0.6);
frame.add(ring1);
const ring2 = new THREE.Mesh(new THREE.TorusGeometry(5.6, 0.035, 8, 220), flat(0xd5f4ff, { transparent: true, opacity: 0.8 }));
ring2.rotation.set(1.32, -0.2, -0.75);
frame.add(ring2);

// 垂れ下がるケーブル
const wires = new THREE.Group();
frame.add(wires);
for (const [col, x0, x1, depth, z] of [[0xe98ae2, -1.4, 1.0, -8.2, 0.4], [0x4b7fe0, -1.0, 1.4, -7.6, 0.1],
                                       [0xe98ae2, -0.6, 0.6, -6.7, -0.3], [0x2c3d8a, -1.8, 0.4, -7.0, 0.7],
                                       [0x4b7fe0, -0.2, 1.8, -8.0, -0.5]]) {
  const sy = x => -Math.sqrt(Math.max(R * R - x * x - z * z, 0)) * 0.97;
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(x0, sy(x0), z),
    new THREE.Vector3(x0 * 1.1, -R - 1.6, z),
    new THREE.Vector3(x0 * 0.9, depth + 0.6, z + 0.2),
    new THREE.Vector3((x0 + x1) / 2, depth, z + 0.3),
    new THREE.Vector3(x1 * 0.9, depth + 0.6, z + 0.2),
    new THREE.Vector3(x1 * 1.1, -R - 1.6, z),
    new THREE.Vector3(x1, sy(x1), z),
  ]);
  wires.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 120, 0.04, 6), flat(col)));
}

// ピンクの粒
const pearls = [];
const pearlGeo = new THREE.SphereGeometry(0.14, 16, 12);
const pearlMat = toon(0xe56fda);
for (let i = 0; i < 18; i++) {
  const pivot = new THREE.Group();
  pivot.rotation.set(rr(-0.6, 0.6), rr(-0.6, 0.6), rr(0, Math.PI * 2));
  const p = new THREE.Mesh(pearlGeo, pearlMat);
  p.position.x = rr(3.6, 5.8);
  pivot.add(p);
  frame.add(pivot);
  pearls.push({ pivot, speed: rr(0.15, 0.4) * (rand() < 0.2 ? -1 : 1) });
}

// ---------------------------------------------------------------- 紙吹雪（カメラ空間）
const confetti = new THREE.Group();
fg.add(confetti);
const triShape = new THREE.Shape();
triShape.moveTo(0, 0.62); triShape.lineTo(-0.5, -0.34); triShape.lineTo(0.56, -0.28); triShape.closePath();
const triGeo = new THREE.ShapeGeometry(triShape);
const ellGeo = new THREE.CircleGeometry(0.5, 28); ellGeo.scale(1, 0.48, 1);
const streakGeo = new THREE.PlaneGeometry(1, 1);

const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
function spawn(c, zMin, zMax) {
  c.z = rr(zMin, zMax);
  const hh = -c.z * tanHalf, hw = hh * camera.aspect;
  c.x = rr(-1.1, 1.1) * hw;
  c.y = rr(-1.1, 1.1) * hh;
}
function makeSet(geo, n, colors, scale, mat) {
  const mesh = new THREE.InstancedMesh(geo, mat, n);
  mesh.frustumCulled = false;
  const items = [];
  for (let i = 0; i < n; i++) {
    mesh.setColorAt(i, new THREE.Color(colors[Math.floor(rand() * colors.length)]));
    const c = { rot: new THREE.Euler(rr(0, 6), rr(0, 6), rr(0, 6)), spin: [rr(-1.5, 1.5), rr(-1.5, 1.5), rr(-1, 1)],
                s: rr(...scale), v: rr(1.5, 4.5), drift: rr(-0.4, 0.4) };
    spawn(c, -34, -2.5);
    items.push(c);
  }
  confetti.add(mesh);
  return { mesh, items };
}
const sets = [
  makeSet(triGeo, 34, [0xf6ea5c, 0xfbf29a, 0xf2df3a], [0.5, 1.4], flat(0xffffff, { side: THREE.DoubleSide })),
  makeSet(ellGeo, 46, [0x2f8cf0, 0x5cc6f6, 0x1a5fd8, 0x8fdcf8], [0.35, 1.0], flat(0xffffff, { side: THREE.DoubleSide })),
];
// 細い白い流線
const streaks = [];
for (let i = 0; i < 5; i++) {
  const m = new THREE.Mesh(streakGeo, flat(0xf2fcff, { transparent: true, opacity: rr(0.12, 0.3), side: THREE.DoubleSide, depthWrite: false }));
  m.scale.set(rr(20, 45), rr(0.06, 0.22), 1);
  m.position.set(rr(-6, 6), rr(-4, 4), rr(-24, -9));
  m.rotation.z = rr(-0.9, 0.9);
  confetti.add(m);
  streaks.push({ m, w: rr(-0.05, 0.05), base: m.rotation.z });
}

// ================================================================ 字幕
const tCanvas = document.createElement('canvas');
const tTex = new THREE.CanvasTexture(tCanvas);
tTex.colorSpace = THREE.SRGBColorSpace;
const tScene = new THREE.Scene();
const tCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
tScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2),
  new THREE.MeshBasicMaterial({ map: tTex, transparent: true, depthTest: false, depthWrite: false })));

function label(g, text, x, y, fs, font, align) {
  g.font = `500 ${fs}px ${font}`;
  const tw = g.measureText(text).width;
  const pad = fs * 0.2;
  const left = align === 'right' ? x - tw : x;
  g.fillStyle = 'rgba(255,255,255,0.94)';
  g.fillRect(left - pad, y - fs * 0.62, tw + pad * 2, fs * 1.24);
  g.fillStyle = '#219ae5';
  g.textBaseline = 'middle';
  g.fillText(text, left, y + fs * 0.05);
}
function drawText() {
  const dpr = renderer.getPixelRatio();
  const w = tCanvas.width = Math.round(innerWidth * dpr);
  const h = tCanvas.height = Math.round(innerHeight * dpr);
  const g = tCanvas.getContext('2d');
  g.clearRect(0, 0, w, h);
  const fs = Math.min(h * 0.037, w * 0.021);
  label(g, 'もう嫌なこと全部投げ出して', w * 0.052, h * 0.5, fs, '"Noto Sans JP", sans-serif', 'left');
  label(g, "Let's abandon everything you hate", w * 0.978, h * 0.5, fs * 0.92, '"Noto Sans JP", Arial, sans-serif', 'right');
  tTex.needsUpdate = true;
}
drawText();
document.fonts.ready.then(drawText);
document.fonts.load('500 20px "Noto Sans JP"').then(drawText);

// ================================================================ loop
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  drawText();
});

const clock = new THREE.Clock();
const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpV = new THREE.Vector3(), tmpS = new THREE.Vector3();
let elapsed = 0;

function update(dt) {
  elapsed += dt;
  const t = elapsed;

  // 階段を「回しながら持ち上げる」ことで、無限に下っていく感覚をつくる
  const p = (t * 0.1) % 1;
  stairs.position.y = p * SIDE;
  stairs.rotation.y = -p * Math.PI / 2;

  body.rotation.set(Math.sin(t * 0.5) * 0.08, Math.sin(t * 0.35) * 0.18, Math.sin(t * 0.4) * 0.05);
  frame.position.copy(camera.position).addScaledVector(camera.getWorldDirection(tmpV), 14 + Math.sin(t * 0.9) * 0.25);
  ring1.rotation.z = -0.6 + t * 0.15;
  ring2.rotation.z = -0.75 - t * 0.1;
  wires.rotation.z = Math.sin(t * 0.8) * 0.06;
  wires.rotation.x = Math.sin(t * 0.6) * 0.08;
  for (const pr of pearls) pr.pivot.rotation.z += pr.speed * dt;

  confetti.position.copy(camera.position);
  confetti.quaternion.copy(camera.quaternion);
  for (const { mesh, items } of sets) {
    items.forEach((c, i) => {
      c.z += c.v * dt;
      c.x += c.drift * dt;
      if (c.z > -1.5) spawn(c, -36, -30);
      c.rot.x += c.spin[0] * dt; c.rot.y += c.spin[1] * dt; c.rot.z += c.spin[2] * dt;
      tmpQ.setFromEuler(c.rot);
      tmpM.compose(tmpV.set(c.x, c.y, c.z), tmpQ, tmpS.setScalar(c.s));
      mesh.setMatrixAt(i, tmpM);
    });
    mesh.instanceMatrix.needsUpdate = true;
  }
  for (const s of streaks) s.m.rotation.z = s.base + Math.sin(t * 0.3 + s.w * 50) * 0.08;
}

function render() {
  renderer.clear();
  renderer.render(world, camera);   // 背景 + 階段
  renderer.render(tScene, tCam);    // 字幕（階段の上、球体の下）
  renderer.clearDepth();
  renderer.render(fg, camera);      // 球体 + 紙吹雪
}

// ?t=秒 で特定の時刻の静止画を確認できる
const fixedT = new URLSearchParams(location.search).get('t');
if (fixedT !== null) {
  for (let s = 0; s < parseFloat(fixedT); s += 1 / 30) update(1 / 30);
  renderer.setAnimationLoop(render);
} else {
  renderer.setAnimationLoop(() => { update(Math.min(clock.getDelta(), 0.05)); render(); });
}
</script>
</body>
</html>
